# Manual deployment to staging or production (ops/RUNBOOK.md §3).
# Configure GitHub *environments* "staging" and "production" (production with
# required reviewers) holding the secrets/variables referenced below.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 30
    env:
      APP_ENV: ${{ inputs.target }}
      VITE_APP_ENV: ${{ inputs.target }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_OTP_LENGTH: ${{ vars.VITE_AUTH_OTP_LENGTH }}
      VITE_MAPS_PROVIDER: ${{ vars.VITE_MAPS_PROVIDER }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
      VITE_PAYMENT_PROVIDER: ${{ vars.VITE_PAYMENT_PROVIDER }}
      VITE_MOYASAR_PUBLISHABLE_KEY: ${{ vars.VITE_MOYASAR_PUBLISHABLE_KEY }}
      # Server-side values (also stored as Supabase function secrets) — used here only by preflight.
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
      MOYASAR_SECRET_KEY: ${{ secrets.MOYASAR_SECRET_KEY }}
      MOYASAR_WEBHOOK_SECRET: ${{ secrets.MOYASAR_WEBHOOK_SECRET }}
      PAYMENT_CALLBACK_URL: ${{ vars.PAYMENT_CALLBACK_URL }}
      PAYMENTS_CRON_SECRET: ${{ secrets.PAYMENTS_CRON_SECRET }}
      WASL_CRON_SECRET: ${{ secrets.WASL_CRON_SECRET }}
      PRIVACY_CRON_SECRET: ${{ secrets.PRIVACY_CRON_SECRET }}
      HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
      GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
      WASL_MODE: ${{ vars.WASL_MODE }}
      WASL_API_BASE_URL: ${{ vars.WASL_API_BASE_URL }}
      WASL_APP_ID: ${{ secrets.WASL_APP_ID }}
      WASL_APP_KEY: ${{ secrets.WASL_APP_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Preflight (configuration, headers, bundle) — must pass before touching anything
        run: npm run preflight -- --target ${{ inputs.target }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest # pin to the CLI version you validated on staging
      - name: Database migrations
        run: |
          npx supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push
      - name: Edge Functions
        run: |
          for f in request-ride payments payments-worker wasl-worker privacy-worker dispatch-tick; do
            npx supabase functions deploy "$f" --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          done
          npx supabase functions deploy payments-webhook --no-verify-jwt --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy health --no-verify-jwt --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      # Hosting: add your provider's deploy step for dist/ here (Netlify, Cloudflare Pages, …).
      # dist/_headers carries the security headers for both.

      - name: Post-deploy readiness (live database)
        run: npm run preflight -- --target ${{ inputs.target }} --db
